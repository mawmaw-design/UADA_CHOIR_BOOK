        width: 100vw;
        overflow: hidden;
      }
      .title-font {

      }

      let currentIndex = 0;

      // Toggle Fullscreen Functionality
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch((err) => {
            console.log(
              `Error attempting to enable fullscreen: ${err.message}`,
            );
          });
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      }

      // Listen for fullscreen change to update button icon/label
      document.addEventListener("fullscreenchange", () => {
        const fsLabel = document.getElementById("fsLabel");
        const fsIcon = document.getElementById("fsIcon");
        const fsBtn = document.getElementById("fsBtn");

        if (document.fullscreenElement) {
          fsLabel.textContent = "Keluar FS";
          fsIcon.className = "fa-solid fa-compress";
          fsBtn.className =
            "px-2 py-1 bg-yellow-400 text-slate-950 font-bold rounded-lg transition text-[10px] sm:text-xs flex items-center gap-1 border border-yellow-500 shadow-xs";
        } else {
          fsLabel.textContent = "Fullscreen";
          fsIcon.className = "fa-solid fa-expand";
          fsBtn.className =
            "px-2 py-1 bg-slate-200 hover:bg-yellow-300 text-slate-800 font-bold rounded-lg transition text-[10px] sm:text-xs flex items-center gap-1 border border-slate-300 shadow-xs";
        }
      });

      function loadSong(index) {
        if (index < 0 || index >= songs.length) return;
        currentIndex = index;
        const song = songs[currentIndex];

        document.getElementById("songTitle").innerHTML = `
                ${song.title} <span class="text-xs font-normal text-slate-500 font-sans ml-1 border-l border-slate-300 pl-2">(${song.lyricist})</span>
            `;
        document.getElementById("songCategory").textContent = song.category;
        document.getElementById("pageIndicator").textContent =
          `Lagu ${currentIndex + 1} dari ${songs.length}`;

        const container = document.getElementById("lyricsContainer");

        // Dynamic Font Sizing for Zero-Scroll Fit
        const lineCount = song.lyrics.length;
        let textSizeClass = "text-[10px] sm:text-xs";
        let paddingClass = "py-0.5 px-1.5 sm:px-2.5";

        if (lineCount > 12) {
          textSizeClass = "text-[9px] sm:text-xs";
          paddingClass = "py-0.5 px-1 sm:px-2";
        } else if (lineCount <= 7) {
          textSizeClass = "text-xs sm:text-sm";
          paddingClass = "py-1 px-2 sm:px-3";
        }

        let htmlContent = song.lyrics
          .map((item, idx) => {
            let badgeStyle = "bg-slate-200 text-slate-800 font-medium";
            let label = "Semua";

            if (item.part === "Lakilaki") {
              badgeStyle = "bg-blue-600 text-white font-semibold";
              label = "Laki-laki";
            } else if (item.part === "Perempuan") {
              badgeStyle = "bg-amber-400 text-slate-950 font-bold";
              label = "Perempuan";
            } else if (item.part === "Musik") {
              badgeStyle = "bg-slate-300 text-slate-600 italic";
              label = "Musik";
            }

            return `
                    <div class="flex items-center justify-between gap-1.5 ${paddingClass} bg-white/90 hover:bg-yellow-100/80 rounded sm:rounded-lg border border-slate-200 transition shadow-xs shrink-0">
                        <div class="flex items-baseline gap-1.5 min-w-0">
                            <span class="text-[9px] sm:text-[10px] text-slate-400 font-mono w-3.5 shrink-0">${idx + 1}.</span>
                            <span class="${textSizeClass} font-semibold text-slate-900 truncate leading-snug">${item.text}</span>
                        </div>
                        <span class="px-1.5 py-0.2 sm:py-0.5 rounded text-[8px] sm:text-[10px] shrink-0 ${badgeStyle}">
                            ${label}
                        </span>
                    </div>
                `;
          })
          .join("");

        // If external link exists, add external link button
        if (song.externalLink) {
          htmlContent += `
                    <div class="mt-1 sm:mt-2 text-center shrink-0">
                        <a href="${song.externalLink}" target="_blank" rel="noopener noreferrer" 
                           class="inline-flex items-center gap-1.5 px-3 py-1 bg-blue-600 hover:bg-blue-500 text-white font-bold text-[10px] sm:text-xs rounded-lg shadow transition transform active:scale-95">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            <span>Buka Lirik Lengkap Sesi Potret (Resmi)</span>
                        </a>
                    </div>
                `;
        }

        container.innerHTML = htmlContent;

        // Navigation Button States
        document.getElementById("prevBtn").disabled = currentIndex === 0;
        document.getElementById("nextBtn").disabled =
          currentIndex === songs.length - 1;
      }

      function turnPage(step) {
        loadSong(currentIndex + step);
      }

      // Touch Swipe Gesture Handling for Mobile Page Turning
      let touchStartX = 0;
      let touchEndX = 0;
      const touchArea = document.getElementById("touchPaperArea");

      touchArea.addEventListener(
        "touchstart",
        (e) => {
          touchStartX = e.changedTouches[0].screenX;
        },
        { passive: true },
      );

      touchArea.addEventListener(
        "touchend",
        (e) => {
          touchEndX = e.changedTouches[0].screenX;
          handleSwipe();
        },
        { passive: true },
      );

      function handleSwipe() {
        const swipeDistance = touchEndX - touchStartX;
        if (swipeDistance < -40) {
          turnPage(1); // Swipe Left -> Next Page
        } else if (swipeDistance > 40) {
          turnPage(-1); // Swipe Right -> Prev Page
        }
      }

      // Quick Search Bar Logic
      const searchInput = document.getElementById("quickSearchInput");
      const dropdown = document.getElementById("searchResultsDropdown");
      const clearBtn = document.getElementById("clearSearchBtn");

      searchInput.addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase().trim();
        if (!q) {
          dropdown.classList.add("hidden");
          clearBtn.classList.add("hidden");
          return;
        }

        clearBtn.classList.remove("hidden");
        const matches = songs
          .map((s, idx) => ({ ...s, originalIndex: idx }))
          .filter(
            (s) =>
              s.title.toLowerCase().includes(q) ||
              s.lyricist.toLowerCase().includes(q) ||
              s.category.toLowerCase().includes(q) ||
              s.lyrics.some((l) => l.text.toLowerCase().includes(q)),
          );

        if (matches.length === 0) {
          dropdown.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">Lagu tidak ditemukan.</div>`;
        } else {
          dropdown.innerHTML = matches
            .map(
              (m) => `
                    <div onclick="selectSearchResult(${m.originalIndex})" class="p-2.5 hover:bg-slate-800 cursor-pointer flex items-center justify-between text-xs border-b border-slate-800/80">
                        <div>
                            <div class="font-bold text-yellow-300">${m.title} <span class="text-[10px] text-slate-400 font-normal">(${m.lyricist})</span></div>
                            <div class="text-[10px] text-slate-400">${m.category}</div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-500 text-[10px]"></i>
                    </div>
                `,
            )
            .join("");
        }
        dropdown.classList.remove("hidden");
      });

      function clearSearch() {
        searchInput.value = "";
        dropdown.classList.add("hidden");
        clearBtn.classList.add("hidden");
      }

      function selectSearchResult(idx) {
        loadSong(idx);
        clearSearch();
      }

      // Dashboard Modal Logic
      function openDashboard() {
        const modal = document.getElementById("dashboardModal");
        modal.classList.remove("opacity-0", "pointer-events-none");
        renderDashGrid("");
      }

      function closeDashboard() {
        const modal = document.getElementById("dashboardModal");
        modal.classList.add("opacity-0", "pointer-events-none");
      }

      function renderDashGrid(query) {
        const grid = document.getElementById("dashGrid");
        const filtered = songs
          .map((s, idx) => ({ ...s, originalIndex: idx }))
          .filter(
            (s) =>
              s.title.toLowerCase().includes(query.toLowerCase()) ||
              s.lyricist.toLowerCase().includes(query.toLowerCase()) ||
              s.category.toLowerCase().includes(query.toLowerCase()),
          );

        grid.innerHTML = filtered
          .map(
            (s) => `
                <button onclick="selectFromDash(${s.originalIndex})" 
                        class="group p-2 sm:p-2.5 bg-slate-800/90 hover:bg-yellow-500/10 border border-slate-700/80 hover:border-yellow-400 rounded-lg sm:rounded-xl transition shadow-sm active:scale-95 flex items-center justify-between text-left gap-1.5">
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-1 mb-0.5">
                            <span class="text-[7px] sm:text-[8px] px-1 py-0.2 rounded bg-slate-900 text-yellow-400 font-semibold uppercase tracking-wider truncate max-w-full">${s.category}</span>
                        </div>
                        <h4 class="font-bold text-white group-hover:text-yellow-300 text-[11px] sm:text-xs truncate transition">${s.title}</h4>
                        <p class="text-[9px] sm:text-[10px] text-slate-400 font-mono truncate">${s.lyricist}</p>
                    </div>
                    <div class="w-5 h-5 sm:w-7 sm:h-7 rounded bg-slate-900 group-hover:bg-yellow-400 group-hover:text-slate-950 text-slate-400 flex items-center justify-center text-[10px] sm:text-xs transition shrink-0">
                        <i class="fa-solid fa-play text-[8px] sm:text-[10px]"></i>
                    </div>
                </button>
            `,
          )
          .join("");
      }

      document
        .getElementById("dashSearchInput")
        .addEventListener("input", (e) => {
          renderDashGrid(e.target.value);
        });

      function selectFromDash(idx) {
        loadSong(idx);
        closeDashboard();
      }

      // Keyboard Shortcuts
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") turnPage(1);
        if (e.key === "ArrowLeft") turnPage(-1);
        if (e.key === "Escape") {
          closeDashboard();
          clearSearch();
        }
      });

      // Load initial page
      window.onload = () => loadSong(0);
    </script>
  </body>
</html>
